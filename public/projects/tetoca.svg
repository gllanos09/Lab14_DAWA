    <rect x="28" y="620" width="324" height="72" rx="36" fill="#10b981"/>
    <text x="190" y="665" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#03231a" text-anchor="middle">Pedir por WhatsApp</text>
