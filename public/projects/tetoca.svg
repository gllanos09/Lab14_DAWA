    <text x="36" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Inventario</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <g transform="translate(28 150)">
