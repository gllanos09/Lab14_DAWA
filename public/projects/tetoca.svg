    <rect x="522" y="610" width="190" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="617" y="647" text-anchor="middle">Firebase</text>
  </g>

  <!-- Teléfono -->
  <g transform="translate(1040 120)">
