        <rect x="20" y="28" width="160" height="16" rx="8" fill="#e2e8f0" fill-opacity="0.8"/>
        <rect x="20" y="60" width="200" height="12" rx="6" fill="#ffffff" fill-opacity="0.15"/>
        <rect x="20" y="60" width="130" height="12" rx="6" fill="#10b981"/>
        <text x="300" y="50" font-size="22" font-weight="700" fill="#6ee7b7" text-anchor="end">OK</text>
